apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Chart.Name }}-schema}
data:
  001-schema.sql: |
    CREATE TABLE products (id INT AUTO_INCREMENT PRIMARY KEY, sku VARCHAR(64) NOT NULL UNIQUE, name VARCHAR(255) NOT NULL, price_cents INT NOT NULL);
    CREATE TABLE orders (id INT AUTO_INCREMENT PRIMARY KEY, sku VARCHAR(64) NOT NULL, quantity INT NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
