{{- range $service := .Values.apiServices }}
apiVersion: v1
kind: Service
metadata: {name: {{ $service }}}
spec:
  selector: {app: {{ $service }}}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $service }}}
spec:
  replicas: 2
  selector: {matchLabels: {app: {{ $service }}}}
  template:
    metadata: {labels: {app: {{ $service }}}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ $.Values.images.api.repository }}:{{ $.Values.images.api.tag }}"
          imagePullPolicy: {{ $.Values.images.api.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SERVICE_NAME, value: {{ $service | quote }}}
            - {name: MYSQL_HOST, value: {{ printf "%s-mysql" $.Chart.Name | quote }}}
            - {name: MYSQL_DATABASE, value: {{ $.Values.database.name | quote }}}
            - {name: MYSQL_USER, value: {{ $.Values.database.user | quote }}}
            - {name: REDIS_HOST, value: {{ printf "%s-redis" $.Chart.Name | quote }}}
            - {name: NATS_HOST, value: {{ printf "%s-nats" $.Chart.Name | quote }}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Chart.Name }}-database, key: password}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml $.Values.resources.api | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
---
{{- end }}
