apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}-mysql}
spec:
  selector: {app: {{ .Chart.Name }}-mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ .Chart.Name }}-mysql}
spec:
  serviceName: {{ .Chart.Name }}-mysql
  replicas: 1
  selector: {matchLabels: {app: {{ .Chart.Name }}-mysql}}
  template:
    metadata: {labels: {app: {{ .Chart.Name }}-mysql}}
    spec:
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: {{ .Values.database.name | quote }}}
            - {name: MYSQL_USER, value: {{ .Values.database.user | quote }}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Chart.Name }}-database, key: root-password}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Chart.Name }}-database, key: password}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe: {exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']}, initialDelaySeconds: 10}
          livenessProbe: {tcpSocket: {port: mysql}, initialDelaySeconds: 30}
      volumes:
        - name: schema
          configMap: {name: {{ .Chart.Name }}-schema}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.mysql.storage }}}}
