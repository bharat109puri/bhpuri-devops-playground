apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}-redis}
spec: {selector: {app: {{ .Chart.Name }}-redis}, ports: [{name: redis, port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Chart.Name }}-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Chart.Name }}-redis}}
  template:
    metadata: {labels: {app: {{ .Chart.Name }}-redis}}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: [redis-server, --save, "", --appendonly, "no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}-nats}
spec: {selector: {app: {{ .Chart.Name }}-nats}, ports: [{name: client, port: 4222}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Chart.Name }}-nats}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Chart.Name }}-nats}}
  template:
    metadata: {labels: {app: {{ .Chart.Name }}-nats}}
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          ports: [{name: client, containerPort: 4222}]
          readinessProbe: {tcpSocket: {port: client}, initialDelaySeconds: 3}
