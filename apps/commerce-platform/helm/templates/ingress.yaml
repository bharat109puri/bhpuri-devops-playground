{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: {{ .Chart.Name }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: catalog-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Chart.Name }}-frontend, port: {name: http}}}
{{- end }}
