apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}-frontend}
spec:
  selector: {app: {{ .Chart.Name }}-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Chart.Name }}-frontend}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: {matchLabels: {app: {{ .Chart.Name }}-frontend}}
  template:
    metadata: {labels: {app: {{ .Chart.Name }}-frontend}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
