{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Chart.Name }}
  labels: {app.kubernetes.io/name: {{ .Chart.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: {{ .Chart.Name }}}}
  strategy:
    canary:
      stableService: {{ .Chart.Name }}
      canaryService: {{ .Chart.Name }}-canary
      {{- if .Values.rollout.analysis.enabled }}
      analysis:
        templates:
          - templateName: {{ .Chart.Name }}-success-rate
      {{- end }}
      steps: {{- toYaml .Values.rollout.steps | nindent 8 }}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ .Chart.Name }}}}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
