{{- if and .Values.rollout.enabled .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: {name: {{ .Chart.Name }}-success-rate}
spec:
  metrics:
    - name: http-success-rate
      interval: 1m
      count: 3
      successCondition: result[0] >= {{ .Values.rollout.analysis.successRateThreshold }}
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_server_duration_milliseconds_count{http_status_code!~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_server_duration_milliseconds_count[2m])), 1)
{{- end }}
