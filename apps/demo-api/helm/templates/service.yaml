apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}}
spec:
  selector: {app.kubernetes.io/name: {{ .Chart.Name }}}
  ports: [{port: {{ .Values.service.port }}, targetPort: 8080}]
{{- if .Values.rollout.enabled }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Chart.Name }}-canary}
spec:
  selector: {app.kubernetes.io/name: {{ .Chart.Name }}}
  ports: [{port: {{ .Values.service.port }}, targetPort: 8080}]
{{- end }}
