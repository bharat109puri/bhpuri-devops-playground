replicaCount: 2
image:
  repository: ghcr.io/bharat109puri/demo-api
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 80
serviceAccount:
  create: true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: nginx
  host: demo-api.local
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
