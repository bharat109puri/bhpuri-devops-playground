apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-root
  namespace: argocd
spec:
  project: playground
  source:
    repoURL: https://github.com/bharat109puri/bhpuri-devops-playground.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
