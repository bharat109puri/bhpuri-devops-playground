apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: playground
  source:
    repoURL: https://github.com/bharat109puri/bhpuri-devops-playground.git
    targetRevision: main
    path: apps/demo-api/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-api
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
