apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-api-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: demo-api-dev
          - environment: staging
            namespace: demo-api-staging
          - environment: prod
            namespace: demo-api-prod
  template:
    metadata:
      name: 'demo-api-{{environment}}'
      labels: {environment: '{{environment}}'}
    spec:
      project: playground
      source:
        repoURL: https://github.com/bharat109puri/bhpuri-devops-playground.git
        targetRevision: main
        path: apps/demo-api/helm
        helm:
          valueFiles: ['environments/{{environment}}.yaml']
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
