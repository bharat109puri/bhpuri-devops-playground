apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: commerce-platform, namespace: argocd}
spec:
  project: playground
  source:
    repoURL: https://github.com/bharat109puri/bhpuri-devops-playground.git
    targetRevision: main
    path: apps/commerce-platform/helm
  destination: {server: "https://kubernetes.default.svc", namespace: commerce}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
