apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: local-kubernetes-store
  namespace: playground
spec:
  provider:
    kubernetes:
      remoteNamespace: playground
      server: {caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt}}
      auth:
        serviceAccount:
          name: external-secrets-reader
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: external-secrets-reader, namespace: playground}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: external-secrets-reader, namespace: playground}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: external-secrets-reader, namespace: playground}
subjects: [{kind: ServiceAccount, name: external-secrets-reader}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: external-secrets-reader}
