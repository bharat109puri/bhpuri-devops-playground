name: Validate playground

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint apps/demo-api/helm
      - name: Validate rendered manifests
        run: helm template demo-api apps/demo-api/helm > /tmp/rendered.yaml
      - name: Build container
        run: docker build --tag demo-api:test apps/demo-api
      - name: Smoke test image
        run: |
          docker run --rm -d --name demo-api -p 8080:8080 demo-api:test
          trap 'docker logs demo-api' EXIT
          for _ in $(seq 1 20); do curl --fail --silent http://localhost:8080/healthz && exit 0; sleep 1; done
          exit 1
