name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions: {contents: read}

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint apps/demo-api/helm
      - name: Render chart
        run: helm template demo-api apps/demo-api/helm > rendered-demo-api.yaml
      - name: Lint generic deployment chart
        run: helm lint charts/web-service
      - name: Lint commerce platform chart
        run: helm lint apps/commerce-platform/helm
      - name: Render commerce platform chart
        run: helm template commerce-platform apps/commerce-platform/helm > rendered-commerce-platform.yaml
      - name: Validate Kubernetes schema
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0-alpine
        with:
          args: -strict -summary rendered-demo-api.yaml rendered-commerce-platform.yaml
  unit-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: python
            command: python -m pip install -r apps/demo-api/requirements-dev.txt && pytest apps/demo-api/tests && python -m compileall apps/commerce-platform/api/app
          - stack: node
            command: node --check apps/demo-node/src/server.js && node --check apps/demo-frontend/src/server.js && node --check apps/demo-frontend/public/app.js
          - stack: ai-python
            command: python -m pip install -r apps/ai-rag/requirements.txt -r apps/ai-langgraph/requirements.txt && PYTHONPATH=apps/ai-rag pytest apps/ai-rag/tests && python -m compileall apps/ai-langgraph/app
          - stack: java
            command: mvn --batch-mode -f apps/demo-spring/pom.xml test
          - stack: php
            command: php -l apps/demo-php/public/index.php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.stack == 'python'
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        if: matrix.stack == 'node'
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        if: matrix.stack == 'ai-python'
        with: {python-version: '3.13'}
      - uses: actions/setup-java@v4
        if: matrix.stack == 'java'
        with: {distribution: temurin, java-version: '21'}
      - uses: shivammathur/setup-php@v2
        if: matrix.stack == 'php'
        with: {php-version: '8.3'}
      - run: ${{ matrix.command }}
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm template demo-api apps/demo-api/helm > rendered-demo-api.yaml
      - name: Enforce deployment guardrails
        run: docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest:v0.56.0 test rendered-demo-api.yaml --policy policies
