apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  demo-api.json: |
    {"annotations":{"list":[]},"panels":[{"type":"timeseries","title":"Pod CPU","targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"demo-api\"}[5m]))"}]}],"schemaVersion":39,"title":"Demo API","version":1}
