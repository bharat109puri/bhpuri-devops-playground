apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.64
          ports: [{containerPort: 16686}, {containerPort: 4317}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger-collector, namespace: monitoring}
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: ui, port: 16686, targetPort: 16686}
