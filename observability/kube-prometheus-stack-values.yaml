grafana:
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: 500m, memory: 1Gi}
alertmanager:
  enabled: true
  config:
    route: {receiver: local-null}
    receivers:
      - name: local-null
